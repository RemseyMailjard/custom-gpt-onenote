openapi: 3.1.0
info:
  title: OneNote Capability Gateway
  version: 0.1.0
  description: Agent-first gateway over Microsoft Graph OneNote. The public contract
    exposes semantic capabilities, not arbitrary Graph URLs or raw OData. Microsoft
    Graph OneNote access is delegated-only; app-only authentication is not supported.
servers:
- url: https://gateway.example.com/onenote/v1
  description: Replace with the deployed OneNote Capability Gateway URL
tags:
- name: Notebooks
- name: Sections
- name: Section groups
- name: Pages
- name: Content
- name: Resources
- name: Copy and move
- name: Operations
security:
- delegatedOneNote:
  - Notes.Read
paths:
  /notebooks:
    get:
      summary: List accessible notebooks
      operationId: onenote_list_notebooks
      tags:
      - Notebooks
      description: Lists notebooks in a typed OneNote context. Raw OData is not accepted.
      security:
      - delegatedOneNote:
        - Notes.Read
      x-agent:
        category: read
        risk: low
        destructive: false
        confirmationRequired: false
        requiresDeterministicResource: false
      x-implementation: graph_primitive
      responses:
        '200':
          description: Successful gateway response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': &id001
          $ref: '#/components/responses/Error400'
        '401': &id002
          $ref: '#/components/responses/Error401'
        '403': &id003
          $ref: '#/components/responses/Error403'
        '404': &id004
          $ref: '#/components/responses/Error404'
        '409': &id005
          $ref: '#/components/responses/Error409'
        '413': &id006
          $ref: '#/components/responses/Error413'
        '429': &id007
          $ref: '#/components/responses/Error429'
        '503': &id008
          $ref: '#/components/responses/Error503'
      x-supported-contexts:
      - me
      - sharedUser
      - group
      - site
      parameters:
      - name: contextType
        in: query
        schema:
          type: string
          enum:
          - me
          - sharedUser
          - group
          - site
          default: me
      - name: contextId
        in: query
        schema:
          type: string
        required: false
      - name: nameContains
        in: query
        schema:
          type: string
        required: false
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Cursor'
    post:
      summary: Create a notebook
      operationId: onenote_create_notebook
      tags:
      - Notebooks
      description: ''
      security:
      - delegatedOneNote:
        - Notes.Create
      x-agent:
        category: create
        risk: medium
        destructive: false
        confirmationRequired: false
        requiresDeterministicResource: false
      x-implementation: graph_primitive
      responses:
        '200':
          description: Successful gateway response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '413': *id006
        '429': *id007
        '503': *id008
      x-supported-contexts:
