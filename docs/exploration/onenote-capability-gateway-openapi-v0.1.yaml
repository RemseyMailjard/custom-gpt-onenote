components:
  securitySchemes:
    delegatedOneNote:
      type: oauth2
      description: Delegated Microsoft identity authorization. The gateway must not
        use client-credentials/app-only authentication for Graph OneNote.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          scopes:
            Notes.Create: Create OneNote notebooks, sections, and pages as the signed-in
              user.
            Notes.Read: Read OneNote notebooks of the signed-in user.
            Notes.Read.All: Read OneNote notebooks accessible to the signed-in organizational
              user.
            Notes.ReadWrite: Read and modify OneNote notebooks as the signed-in user.
            Notes.ReadWrite.All: Read and modify OneNote notebooks accessible to the
              signed-in organizational user.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque gateway cursor. Never pass a Microsoft Graph @odata.nextLink.
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Recommended for create/copy composite operations to prevent duplicate
        execution.
      schema:
        type: string
        minLength: 8
        maxLength: 200
  schemas:
    GatewayContext:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        properties:
          type:
            const: me
      - type: object
        additionalProperties: false
        required:
        - type
        - userId
        properties:
          type:
            const: sharedUser
          userId:
            type: string
            minLength: 1
      - type: object
        additionalProperties: false
        required:
        - type
        - groupId
        properties:
          type:
            const: group
          groupId:
            type: string
            minLength: 1
      - type: object
        additionalProperties: false
        required:
        - type
        - siteId
        properties:
          type:
            const: site
          siteId:
            type: string
            minLength: 1
      discriminator:
        propertyName: type
    Notebook:
